[project]
name = "tcalpha-backend"
version = "0.8.6"
description = "TCAlpha backend — FastAPI + Celery + ArcticDB + AKShare"
requires-python = ">=3.13"
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Tiramisuliake" }]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    # Redis / Celery
    "redis>=5.2",
    "celery>=5.4",
    # ArcticDB
    "arcticdb>=5.0",
    # 数据 / 量化
    "akshare>=1.15",
    "pandas>=2.2",
    "numpy>=2.0",
    # VNPY（保留作为策略基类来源）
    "vnpy>=4.3",
    # AI
    "openai>=1.50",
    # 工具
    "loguru>=0.7",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "tenacity>=9.0",                # 限流重试
    "pytz>=2024.2",
    "pandas-market-calendars>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "types-pytz",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]
ignore = ["E501"]                     # 行长由 formatter 处理

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
exclude = ["alembic/versions/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
